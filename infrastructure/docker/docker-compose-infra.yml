version: '3.8'

services:
  # =====================================================================
  # 1. PostgreSQL 16 - Database-per-Service (Multi-Database on Local Image)
  # Uses pre-downloaded local image: postgres:16 (0 bytes download needed)
  # =====================================================================
  hms-postgres:
    image: postgres:16
    container_name: hms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ../postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
      - hms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hms-network

  # =====================================================================
  # 2. Redis 7 - Cache-Aside Store for Read-Heavy Hotel Catalog
  # Uses pre-downloaded local image: redis:7 (0 bytes download needed)
  # =====================================================================
  hms-redis:
    image: redis:7
    container_name: hms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - hms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hms-network

  # =====================================================================
  # 3. Apache Kafka 3.7.0 (KRaft Mode - ZooKeeper-less)
  # Uses official apache/kafka:3.7.0 image with KRaft consensus
  # =====================================================================
  hms-kafka:
    image: apache/kafka:3.7.0
    container_name: hms-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: '4L622nShTZaJvtPGBm-JyA'
    volumes:
      - hms_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

networks:
  hms-network:
    name: hms-network
    driver: bridge

volumes:
  hms_postgres_data:
    name: hms_postgres_data
  hms_redis_data:
    name: hms_redis_data
  hms_kafka_data:
    name: hms_kafka_data

