# =====================================================================
# Hospitality Management System - Redis Configuration
# =====================================================================

# Network & Connectivity
port 6379
bind 0.0.0.0
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management (Interview focus: eviction strategy)
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistence (RDB + AOF for durability & fast restart)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
