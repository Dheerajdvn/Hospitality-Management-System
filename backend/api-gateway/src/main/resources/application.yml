server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/customers/**

        - id: hotel-service
          uri: ${HOTEL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/hotels/**

        - id: room-service
          uri: ${ROOM_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/rooms/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/bookings/**

        - id: food-service
          uri: ${FOOD_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/food/**

        - id: room-service-management
          uri: ${RSM_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/room-service/**

        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/billing/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/inventory/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/notifications/**

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    com.hospitality.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
